name: Registry response diagnostic

# WHAT DID THE RUNNER ACTUALLY RECEIVE?
#
# On 2026-09-14 the weekly registry run reported 185 disagreements from a
# GitHub-hosted runner while the same commit reported 15 from a laptop. All 45
# CFA records failed, including breeds whose pages read correctly seconds later
# from another network. Nothing recorded what the runner had actually been
# served, so "CFA changed its template" and "this runner was handed an
# interstitial" were equally consistent with the evidence.
#
# This answers that, and nothing else. It fetches pages and prints a safe
# description of each: status, final URL after redirects, byte count, SHA-256,
# what the document says it is, which structural markers are present, and which
# infrastructure headers answered. It compares nothing against the corpus,
# writes nothing, and cannot fail a gate.
#
# TWO MODES, AND THE REQUEST COUNT OF EACH
#
#   targeted (default)  exactly 4 requests — three CFA pages chosen to separate
#                       a real finding from a fetch artefact, plus one FCI page
#                       as a control on the network rather than on CFA.
#   sweep               every CFA URL the corpus cites (45), at the verifier's
#                       own 900 ms cadence, to see whether a block is triggered
#                       by volume rather than by origin.
#
# They are mutually exclusive and each page is fetched ONCE per run. An earlier
# version ran the script twice for one answer — once for people, once for JSON —
# and swept on top, so a blank dispatch made 53 requests while this comment said
# four. Both renderings now come from one set of responses.
#
# WHAT IT NEVER PRINTS
#
#   response bodies, Set-Cookie, Cookie, Authorization, request headers, tokens.
#   See scripts/lib/registry-diagnostics.mjs — the header list is an allowlist,
#   and everything about the body is reduced to a number, a hash or a boolean.
#
# TESTING A BRANCH
#
# Dispatch this workflow with the branch selected as the ref: workflow_dispatch
# runs the workflow file and scripts FROM THAT REF, so a change to either can be
# exercised before merge. Via the API:
#
#   gh workflow run registry-diagnostic.yml --ref <branch> -f mode=targeted
#
# It is dispatch-only by design. It previously carried a `pull_request` trigger
# so that a branch could be tested before the workflow existed on main; now that
# it does exist on main, that trigger was pure standing cost — external requests
# on pull requests that had no question to answer. `pull_request_target` is NOT
# an alternative: it runs with a writable token against the base repository.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'targeted (4 requests) or sweep (every CFA URL at 900 ms)'
        required: false
        default: 'targeted'
        type: choice
        options:
          - targeted
          - sweep
      urls:
        description: 'Optional https registry URLs, space-separated. Not valid with sweep.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: registry-diagnostic
  cancel-in-progress: false

jobs:
  describe:
    name: Describe what this runner receives
    runs-on: ubuntu-latest
    # A sweep is 45 requests at 900 ms — under a minute of traffic. This must
    # never look like the 45-minute verification job.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # INPUT TRAVELS AS DATA, NOT AS COMMAND TEXT.
      #
      # This step used to read:
      #
      #     run: node scripts/diagnose-registry-response.mjs ${{ inputs.urls }}
      #
      # GitHub substitutes `${{ }}` into the script text BEFORE bash parses it,
      # so the input was not an argument — it was source code, and anyone able
      # to dispatch the workflow could run commands on the runner with the job's
      # token in scope. `; whoami` needed no quoting cleverness at all.
      #
      # The fix is not escaping, which is a filter you must get right every time
      # against a shell you do not control. The value now travels in an
      # environment variable, which the runner hands to the process verbatim and
      # never parses, and every decision about it is made in Node on a string —
      # https only, an explicit registry host allowlist, no embedded
      # credentials, a URL ceiling, and EX_USAGE with nothing fetched if any of
      # that fails. See scripts/lib/diagnostic-input.mjs.
      - name: Describe registry responses
        env:
          FAUNAHUB_DIAGNOSTIC_MODE: ${{ inputs.mode }}
          FAUNAHUB_DIAGNOSTIC_URLS: ${{ inputs.urls }}
          FAUNAHUB_DIAGNOSTIC_EMIT: both
        run: node scripts/diagnose-registry-response.mjs
