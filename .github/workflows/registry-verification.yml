name: Registry verification

# `breeds:verify` re-fetches every cited registry page and compares it against
# what FaunaHub publishes. It is the most valuable check in the repository and
# it deliberately does NOT gate pull requests.
#
# WHY IT IS NOT IN ci.yml
#
#   1. It makes 311 live requests to akc.org, cfa.org, fifeweb.org and fci.be,
#      rate-limited to one every 900 ms — roughly five minutes of traffic
#      against four third parties, on every push and every PR.
#   2. Its result depends on those sites, not on the diff. A registry outage, a
#      403, or a redesigned page would fail a pull request that changed a CSS
#      token. A gate that goes red for reasons the author cannot fix teaches
#      people to merge past red.
#   3. A disagreement here is not necessarily an error. A registry may have
#      revised a standard, in which case the fix is to update the record AND its
#      reviewedAt date — a research task, not a build failure.
#
# So it runs weekly and on demand, and it reports rather than blocks. The gates
# that ARE deterministic and offline — index, facet, search and finder checks —
# all gate every PR in ci.yml.

on:
  schedule:
    # Mondays at 06:00 UTC, before the working week.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-verification
  cancel-in-progress: false

jobs:
  verify-registries:
    name: Re-fetch every cited registry page
    runs-on: ubuntu-latest
    # Generous: 311 requests at 900 ms plus fetch time, with headroom for slow
    # registry responses.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # THREE OUTCOMES, NOT TWO.
      #
      # This step used to carry `continue-on-error: true`, which made GitHub
      # report the step's conclusion as SUCCESS whatever happened. The first
      # weekly run exited 1 with 64 findings and the badge was green; the only
      # place the truth appeared was line 215 of the raw log.
      #
      # The verifier now distinguishes them by exit code:
      #   0  CLEAN         every cited source still says what the record claims
      #   1  DISAGREEMENT  a source and a record disagree — a person must look
      #   2  DEGRADED      a source would not answer, so it said nothing at all
      #
      # DISAGREEMENT fails the job. DEGRADED does not, because an unreachable
      # registry is not evidence of anything — but it is surfaced as a warning
      # annotation and in the job summary, so it can never read as CLEAN.
      - name: Verify published records against their cited sources
        id: verify
        run: |
          set +e
          npm run breeds:verify
          code=$?
          set -e
          case "$code" in
            0) echo "verdict=CLEAN" >> "$GITHUB_OUTPUT" ;;
            1) echo "verdict=DISAGREEMENT" >> "$GITHUB_OUTPUT"
               echo "::error::Registry verification found disagreements — see the job summary"
               exit 1 ;;
            2) echo "verdict=DEGRADED" >> "$GITHUB_OUTPUT"
               echo "::warning::Registry verification DEGRADED — one or more sources were unreachable after a retry. No disagreement was found, and no record was changed." ;;
            *) echo "verdict=ERROR" >> "$GITHUB_OUTPUT"
               echo "::error::Registry verification exited unexpectedly with $code"
               exit "$code" ;;
          esac

      - name: Verdict
        if: always()
        run: |
          echo "Registry verification verdict: ${{ steps.verify.outputs.verdict || 'ERROR' }}"

      # Offline diagnostics, safe to run unconditionally.
      - name: Facet coverage report
        run: npm run breeds:facets

      - name: Animal Finder audit
        run: npm run finder:audit
