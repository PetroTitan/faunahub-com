name: CI

# Every gate that must hold before main can change.
#
# main auto-deploys, so a merge is a release. Until now nothing ran these checks
# automatically: the index, facet and search checks existed as npm scripts that
# a human had to remember, and `prebuild` regenerates those artifacts anyway, so
# staleness self-healed at build time and never surfaced.
#
# Ordering is deliberate — the cheap checks fail first, and the build runs last
# because it is the only step measured in minutes.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only. This workflow never deploys, never publishes and needs no secrets;
# it must not be able to.
permissions:
  contents: read

# A superseded PR run is wasted compute and a confusing status. Pushes to main
# are never cancelled, because each one is a release whose result must be known.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # The job NAME is the status-check context branch protection binds to, so it
    # is deliberately short and stable. A descriptive label here ("Lint, types,
    # tests, gates, build") becomes the required-check string, and renaming it
    # later silently detaches the protection rule — the rule keeps waiting for a
    # check that no longer exists, or stops blocking entirely.
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 24 matches the environment every one of these gates was validated
      # on. package.json allows >=22.18.0; CI pins the validated major rather
      # than drifting with the runner's default.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      # Reviewed advisory policy, not a bare `npm audit`. Any critical fails,
      # and so does anything outside the documented allowlist. See
      # scripts/audit-policy.mjs for why the two residual entries are accepted.
      - name: Security policy
        run: npm run audit:policy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The generated corpora must already match their sources in the commit,
      # not merely after a build regenerates them.
      - name: Breed index is committed and current
        run: npm run breeds:index:check

      - name: Facet coverage has not degraded
        run: npm run breeds:facets:check

      - name: Search index is committed and current
        run: npm run search:check

      - name: Animal Finder index is committed and current
        run: npm run finder:check

      # THE BUILD RUNS BEFORE THE TESTS, and that order is load-bearing.
      #
      # Three of the strongest guards read the real build artifact — the breed
      # hub's prerendered HTML, the prerender manifest against the search index,
      # and the emitted /animals URLs against what Next actually built. Each
      # skips when `.next` is absent rather than passing silently, which is
      # correct behaviour and was invisible here: this workflow's first run
      # tested before it built, so all three skipped and the job still went
      # green. 509 passed, 3 skipped, and the skipped ones were the checks that
      # touch reality.
      #
      # `prebuild` also runs all three generators, so this step proves the
      # build's own generation agrees with what is committed.
      - name: Production build
        run: npm run build

      - name: Tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test-output.txt
          # A skipped test is not a passing test. If a guard cannot run in CI,
          # that is a CI defect to fix, not a result to accept.
          if ! grep -qE 'skipped 0$' /tmp/test-output.txt; then
            echo "::error::tests were skipped — every guard must execute in CI"
            grep -E '^[^0-9].*# ' /tmp/test-output.txt | head -20 || true
            exit 1
          fi

      # Nothing the build touched may differ from the commit, except the one
      # `generatedAt` date stamp two indexes carry. A bare `git diff
      # --exit-code` cannot express that and would fail every PR on the day
      # after a commit; scripts/check-generated-clean.mjs explains the rule.
      - name: Generated artifacts are clean
        run: npm run generated:check

      # The belt to that braces: catches anything outside the two date-stamped
      # files, in a form a reviewer can read at a glance.
      - name: No unexpected source changes
        run: |
          git diff --exit-code -- \
            ':(exclude)public/search-index.json' \
            ':(exclude)public/animal-finder-index.json'
